<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0c1424}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1280, H = 720;
const C = { bg: "#0c1424", blue: "#1f4e9c", blue2: "#17407f", ink: "#ffffff", muted: "#b7c7e6", ball: "#f0691e",
  win: "#6fe3a0", loss: "#ff8a8a", line: "rgba(255,255,255,.16)", card: "#142a52" };
const TIER = [["Iron", "#8a837d", "<875"], ["Bronze", "#a0643c", "875"], ["Silver", "#98a6b3", "925"], ["Gold", "#c9a227", "975"],
  ["Platinum", "#2aa198", "1025"], ["Emerald", "#1f9d5b", "1075"], ["Diamond", "#5b7be0", "1125+"]];
const APEX = [["Master", "#9b4fd1", "#3"], ["Grandmaster", "#d2452f", "#2"], ["Challenger", "#e0b84f", "#1"]];
const F = "'Liberation Sans', 'DejaVu Sans', Arial, sans-serif", M = "'DejaVu Sans Mono', 'Liberation Mono', monospace";

const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const prog = (t, a, d) => ease((t - a) / d);           // 0→1 eased between a and a+d
function text(s, x, y, size, color = C.ink, align = "left", weight = "bold", alpha = 1, font = F) {
  g.save(); g.globalAlpha *= alpha; g.fillStyle = color; g.font = `${weight} ${size}px ${font}`; g.textAlign = align; g.textBaseline = "middle"; g.fillText(s, x, y); g.restore();
}
function rrect(x, y, w, h, r, fill, stroke) {
  g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); }
}
function diamond(x, y, s, color) { g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillStyle = color; g.fillRect(-s / 2, -s / 2, s, s); g.restore(); }
function ballAt(x, y, r = 12) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = C.ball; g.fill(); }
function bg() {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#173d79"); gr.addColorStop(1, "#0f2850");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(W / 2 - 1, 0, 2, H);               // table centre line
}
function heading(s, lt, sub) {
  const a = prog(lt, 0, .5);
  text(s, 80, 90 - 20 * (1 - a), 54, C.ink, "left", "bold", a);
  if (sub) text(sub, 80, 140, 24, C.muted, "left", "normal", prog(lt, .3, .5));
}
function card(x, y, name, elo, opts = {}) {
  const { w = 260, h = 150, alpha = 1, delta = null, tier = null, tierColor = null } = opts;
  g.save(); g.globalAlpha = alpha;
  rrect(x, y, w, h, 16, C.card, C.line);
  text(name, x + 24, y + 40, 32);
  text(String(Math.round(elo)), x + 24, y + 98, 48, C.ink, "left", "bold", 1, M);
  if (delta !== null && delta !== 0) text((delta > 0 ? "+" : "−") + Math.abs(Math.round(delta)), x + w - 24, y + 98, 36, delta > 0 ? C.win : C.loss, "right", "bold", 1, M);
  if (tier) { diamond(x + 30, y + 132, 12, tierColor); text(tier, x + 46, y + 132, 18, C.muted, "left", "bold"); }
  g.restore();
}

// ---------- scenes: [duration, draw(localTime)] ----------
const scenes = [
  [5, t => {                                                     // title
    const a = prog(t, 0, .8);
    const bx = 160 + (W - 320) * ((t * .55) % 1), by = 560 - Math.abs(Math.sin(t * Math.PI * 1.1)) * 140;
    rrect(140, 520, W - 280, 14, 7, "rgba(255,255,255,.12)");
    ballAt(bx, by, 14);
    text("SRL PINGPONG ARENA", W / 2, 250, 84, C.ink, "center", "bold", a);
    text("How scoring works", W / 2, 340, 40, C.ball, "center", "bold", prog(t, .6, .6));
    text("in one minute", W / 2, 395, 24, C.muted, "center", "normal", prog(t, 1, .6));
  }],
  [6, t => {                                                     // start at 1000
    heading("Everyone starts at 1000", t, "1000 is Gold, the middle of the ladder.");
    ["Hansol", "Meedeum", "Dohyeon", "Gwanwoo"].forEach((n, i) => {
      const a = prog(t, .6 + i * .25, .5);
      card(80 + i * 290, 300 + 30 * (1 - a), n, 1000, { alpha: a, tier: "Gold", tierColor: "#c9a227" });
    });
  }],
  [10, t => {                                                    // a win moves points
    heading("Win, and you take points from the loser", t, "The same amount moves from one player to the other.");
    const p = prog(t, 3, 1.2), d = 16 * p;
    card(140, 300, "Hansol", 1000 + d, { w: 330, delta: p > .05 ? d : null });
    card(W - 470, 300, "Meedeum", 1000 - d, { w: 330, delta: p > .05 ? -d : null });
    text("vs", W / 2, 375, 34, C.muted, "center");
    if (t < 3) { const k = (t * 1.3) % 2, x = k < 1 ? 470 + (W - 940) * k : 470 + (W - 940) * (2 - k); ballAt(x, 470 - Math.sin(Math.PI * (k % 1)) * 90, 12); }
    text("Even match  →  ±16 points", W / 2, 560, 38, C.ink, "center", "bold", prog(t, 4.2, .6));
    text("The most one game can move is 32 (the K-factor).", W / 2, 615, 22, C.muted, "center", "normal", prog(t, 5, .6));
  }],
  [10, t => {                                                    // upsets pay more
    heading("Upsets pay more", t, "Points depend on how surprising the result was.");
    const rows = [["Favourite wins", "1100 beats 1000", 12, "64% expected"], ["Even match", "1000 beats 1000", 16, "50% expected"], ["Upset!", "1000 beats 1100", 20, "36% expected"]];
    rows.forEach(([a, b, pts, e], i) => {
      const y = 260 + i * 110, show = prog(t, .8 + i * .7, .5), grow = prog(t, 1 + i * .7, 1);
      text(a, 80, y, 32, i === 2 ? C.ball : C.ink, "left", "bold", show);
      text(`${b} · ${e}`, 80, y + 36, 20, C.muted, "left", "normal", show);
      rrect(520, y - 18, 560 * grow * pts / 20, 36, 8, i === 2 ? C.ball : "#ffffff");
      text("±" + Math.round(pts * grow), 520 + 560 * grow * pts / 20 + 16, y, 34, C.ink, "left", "bold", show, M);
    });
    text("points = 32 × (1 − chance of winning)", W / 2, 640, 26, C.muted, "center", "normal", prog(t, 4.5, .8), M);
  }],
  [8, t => {                                                     // 2v2
    heading("2v2: teams use their average", t, "Every winner gains, every loser loses the same amount.");
    const a = prog(t, .7, .6), b = prog(t, 1.2, .6);
    g.globalAlpha = a; rrect(80, 240, 500, 210, 18, C.card, C.line);
    text("Hansol 1060  +  Dohyeon 980", 110, 290, 26); text("Team rating 1020", 110, 345, 34, C.ink, "left", "bold", 1, M);
    g.globalAlpha = b; rrect(W - 580, 240, 500, 210, 18, C.card, C.line);
    text("Meedeum 1000  +  Gwanwoo 1040", W - 550, 290, 26); text("Team rating 1020", W - 550, 345, 34, C.ink, "left", "bold", 1, M);
    g.globalAlpha = 1;
    text("vs", W / 2, 345, 34, C.muted, "center", "bold", b);
    text("2v2 counts HALF in the Overall ladder", W / 2, 540, 36, C.ball, "center", "bold", prog(t, 2.6, .6));
    text("so a strong partner can't carry you up the main ranking (±8 for an even game).", W / 2, 592, 22, C.muted, "center", "normal", prog(t, 3.2, .6));
  }],
  [8, t => {                                                     // newcomers
    heading("New players find their level fast", t);
    text("First 5 games: placements", 80, 230, 32, C.ink, "left", "bold", prog(t, .6, .5));
    for (let i = 0; i < 5; i++) {
      const f = prog(t, 1.2 + i * .35, .3);
      g.beginPath(); g.arc(110 + i * 70, 300, 22, 0, 7); g.fillStyle = f > .5 ? C.ball : "rgba(255,255,255,.12)"; g.fill();
    }
    text("then you get a tier", 470, 300, 26, C.muted, "left", "normal", prog(t, 3, .5));
    text("First 10 games count DOUBLE for you", 80, 420, 32, C.ink, "left", "bold", prog(t, 3.6, .5));
    text("…but your opponent only gains or loses the normal amount.", 80, 470, 24, C.muted, "left", "normal", prog(t, 4.2, .5));
    const p = prog(t, 4.6, 1);
    card(80, 520, "New: Jisoo", 1000 + 32 * p, { w: 330, h: 140, delta: p > .05 ? 32 * p : null });
    card(450, 520, "Hansol", 1000 - 16 * p, { w: 330, h: 140, delta: p > .05 ? -16 * p : null });
  }],
  [9, t => {                                                     // tiers
    heading("Tiers, like League of Legends", t, "Your rating sets your tier. The top 3 get the apex tiers.");
    const x0 = 80, segW = 104;
    TIER.forEach(([n, col, r], i) => {
      const a = prog(t, .8 + i * .22, .4), x = x0 + i * (segW + 4);
      g.globalAlpha = a; g.fillStyle = col; g.fillRect(x, 300, segW, 22);
      text(n, x + segW / 2, 350, 20, C.ink, "center"); text(r, x + segW / 2, 380, 17, C.muted, "center", "normal", 1, M);
      g.globalAlpha = 1;
    });
    APEX.forEach(([n, col, r], i) => {
      const a = prog(t, 3 + i * .35, .5), x = x0 + 7 * (segW + 4) + 24 + i * 108;
      g.globalAlpha = a; g.fillStyle = col; g.fillRect(x, 294, 100, 34);
      text(n, x + 50, 350, 16, C.ink, "center"); text(r, x + 50, 380, 17, C.muted, "center", "normal", 1, M);
      g.globalAlpha = 1;
    });
    text("rating  →", x0, 420, 18, C.muted, "left", "normal", prog(t, 2.5, .5));
    text("top 3 players rated 1025+  →", x0 + 7 * (segW + 4) + 20, 420, 18, C.muted, "left", "normal", prog(t, 4, .5));
    text("Start at Gold (1000). Your first 5 games are placements.", W / 2, 540, 28, C.ink, "center", "bold", prog(t, 5, .6));
  }],
  [7, t => {                                                     // badges
    heading("Badges", t);
    const a = prog(t, .6, .5), b = prog(t, 1.6, .5);
    g.globalAlpha = a; rrect(80, 220, W - 160, 130, 18, C.card, C.line);
    g.beginPath(); g.moveTo(150, 320); g.quadraticCurveTo(110, 270, 150, 235); g.quadraticCurveTo(160, 270, 185, 260); g.quadraticCurveTo(200, 300, 150, 320); g.fillStyle = C.ball; g.fill();
    text("Win streak", 230, 265, 34); text("3 or more wins in a row. One loss ends it.", 230, 310, 24, C.muted, "left", "normal");
    g.globalAlpha = b; rrect(80, 380, W - 160, 130, 18, C.card, C.line);
    g.strokeStyle = "#ffffff"; g.lineWidth = 6; g.beginPath(); g.moveTo(125, 470); g.lineTo(180, 415); g.moveTo(180, 470); g.lineTo(125, 415); g.stroke();
    text("Giant killer", 230, 425, 34); text("Beat someone rated 100+ points higher in the last 7 days.", 230, 470, 24, C.muted, "left", "normal");
    g.globalAlpha = 1;
  }],
  [6, t => {                                                     // end card
    text("That's it. Go play!", W / 2, 250, 72, C.ink, "center", "bold", prog(t, 0, .6));
    text("Log a match in 3 taps, by voice, or from Slack.", W / 2, 340, 30, C.muted, "center", "normal", prog(t, .6, .6));
    rrect(W / 2 - 330, 420, 660, 80, 40, C.ball);
    text("chomeed.github.io/srl_pingpongarena", W / 2, 460, 30, "#ffffff", "center", "bold", 1, M);
    const bx = W / 2 - 300 + 600 * ((t * .5) % 1); ballAt(bx, 600 - Math.abs(Math.sin(t * Math.PI)) * 60, 12);
  }],
];
const TOTAL = scenes.reduce((s, [d]) => s + d, 0);

function draw(time) {
  bg();
  let start = 0;
  for (const [d, fn] of scenes) {
    if (time < start + d) {
      const lt = time - start;
      g.save(); g.globalAlpha = cl(Math.min(lt / .35, (d - lt) / .35)); fn(lt); g.restore();
      break;
    }
    start += d;
  }
  // progress bar
  g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, H - 6, W, 6);
  g.fillStyle = C.ball; g.fillRect(0, H - 6, W * time / TOTAL, 6);
}
window.TOTAL = TOTAL; window.draw = draw;
</script></body></html>
