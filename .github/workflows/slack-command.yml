name: Deploy Slack command

# Deploys the /pingpong Slack command to Cloudflare Workers.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SLACK_SIGNING_SECRET, SLACK_TEAM_ID.
on:
  workflow_dispatch:
  push:
    paths: ["slack-command/**", "arena-core.mjs", "voice-parse.js"]

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        id: check
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.SLACK_SIGNING_SECRET }}
          D: ${{ secrets.SLACK_TEAM_ID }}
        run: |
          missing=""
          [ -z "$A" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$B" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$C" ] && missing="$missing SLACK_SIGNING_SECRET"
          [ -z "$D" ] && missing="$missing SLACK_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::warning::Slack command not deployed. Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: slack-command
          secrets: |
            SLACK_SIGNING_SECRET
            SLACK_TEAM_ID
        env:
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
